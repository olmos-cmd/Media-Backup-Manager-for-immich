name: Fehlerbericht / Bug report
description: Einen reproduzierbaren Fehler melden / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine API-Schlüssel oder privaten Serveradressen veröffentlichen.  
        Do not publish API keys or private server addresses.
  - type: input
    id: version
    attributes:
      label: Programmversion / Application version
      placeholder: "1.3.3"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Sprache / Language
      options:
        - Deutsch
        - English
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Beschreibung / Description
      description: Was ist passiert und was wurde erwartet? / What happened and what was expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion / Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Zusätzliche Informationen / Additional information
      description: Windows-Version, Immich-Version, Fehlermeldung und bereinigte Screenshots / Windows version, Immich version, error message, and redacted screenshots
