name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Build release
        run: cargo build --release

      - name: Rename executable
        shell: pwsh
        run: Copy-Item target/release/media_backup_manager.exe Media Backup Manager.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Media_Backup_Manager_Windows
          path: Media Backup Manager.exe
          retention-days: 14
